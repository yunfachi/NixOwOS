[book]
title = "NixOwOS"
authors = ["yunfachi"]
description = "Complete redesign of NixOS into NixOwOS."
language = "en"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/yunfachi/nixowos"
edit-url-template = "https://github.com/yunfachi/nixowos/edit/master/docs/{path}"
additional-css = ["theme/pagetoc.css", "theme/tabs.css"]
additional-js  = ["theme/pagetoc.js", "theme/tabs.js", "theme/no-edit-generated.js"]
no-section-label = true
sidebar-header-nav = false

[output.html.print]
enable = false

[preprocessor.treesitter]
command = "mdbook-treesitter"
languages = ["nix"]

[preprocessor.pagetoc]
scroll_offset = 10

[preprocessor.tabs]